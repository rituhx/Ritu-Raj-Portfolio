<section class="section certifications-section" id="certifications">
  <div class="container">

    <div class="section-header">
      <div class="section-kicker">
        <span>Credentials</span>
      </div>
      <h2 class="section-title">
        Certifications &amp; <span>Degrees</span>
      </h2>
      <p class="section-lead">
        Verified academic degrees, professional AI/cloud certifications, and technical proficiencies representing continuous engineering growth.
      </p>
    </div>

    <!-- FEATURED GRADUATION DEGREE -->
    <div class="graduation-card-wrap" id="graduation-card"></div>

    <!-- 4 CERTIFICATES GRID -->
    <div class="certs-grid" id="certs-grid"></div>

  </div>
</section>

<!-- CERTIFICATE / DEGREE PREVIEW MODAL -->
<div class="certificate-modal" id="certificate-modal" aria-hidden="true">
  <div class="certificate-modal-backdrop" data-certificate-close></div>

  <div class="certificate-modal-box" role="dialog" aria-modal="true" aria-labelledby="certificate-modal-title">
    <div class="certificate-modal-header">
      <div>
        <span class="certificate-modal-kicker mono-label">VERIFIED CREDENTIAL</span>
        <h3 id="certificate-modal-title">Certificate Preview</h3>
      </div>
      <button type="button" class="certificate-close" data-certificate-close aria-label="Close preview">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="certificate-modal-content" id="certificate-modal-content"></div>
  </div>
</div>
