<section
  class="section certifications-section"
  id="certifications"
>
  <div class="container">

    <div class="certifications-header">

      <div>

        <p class="section-kicker">
          Credentials
        </p>

        <h2 class="section-title">
          Certifications &
          <span>learning</span>
        </h2>

        <p class="section-lead">
          A collection of certifications and learning experiences
          that reflect continuous growth and technical development.
        </p>

      </div>

    </div>


    <!-- =========================================
         FEATURED GRADUATION DEGREE
         BIG HORIZONTAL CARD
    ========================================== -->

    <div
      class="graduation-card"
      id="graduation-card"
    ></div>


    <!-- =========================================
         4 CERTIFICATES
         2 × 2 GRID
    ========================================== -->

    <div
      class="certs-grid"
      id="certs-grid"
    ></div>

  </div>
</section>


<!-- =========================================
     CERTIFICATE / DEGREE PREVIEW MODAL
========================================= -->

<div
  class="certificate-modal"
  id="certificate-modal"
  aria-hidden="true"
>

  <div
    class="certificate-modal-backdrop"
    data-certificate-close
  ></div>


  <div
    class="certificate-modal-box"
    role="dialog"
    aria-modal="true"
    aria-labelledby="certificate-modal-title"
  >

    <div class="certificate-modal-header">

      <div>

        <span class="certificate-modal-kicker">
          Preview
        </span>

        <h3 id="certificate-modal-title">
          Certificate Preview
        </h3>

      </div>


      <button
        type="button"
        class="certificate-close"
        data-certificate-close
        aria-label="Close preview"
      >
        ×
      </button>

    </div>


    <div
      class="certificate-modal-content"
      id="certificate-modal-content"
    ></div>

  </div>

</div>
