<!-- =====================================================
     LATEST WORK VIDEO MODAL
====================================================== -->

<div
  class="project-modal"
  id="project-modal"
  aria-hidden="true"
>

  <div
    class="project-modal-backdrop"
    id="project-modal-backdrop"
  ></div>

  <div
    class="project-modal-content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="project-modal-title"
  >

    <button
      class="project-modal-close"
      id="project-modal-close"
      type="button"
      aria-label="Close latest work"
    >
      ×
    </button>

    <div class="project-video-section">

      <p class="project-modal-kicker">
        LATEST WORK
      </p>

      <h2 id="project-modal-title">
        My Latest Work
      </h2>

      <div class="project-video-wrapper">

        <video
          id="company-project-video"
          controls
          playsinline
          preload="auto"
        >

          <source
            src="/assets/video/company-project-demo.mp4"
            type="video/mp4"
          >

          Your browser does not support the video tag.

        </video>

      </div>

    </div>

  </div>

</div>
