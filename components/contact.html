<section class="section" id="contact">
  <div class="container">

    <p class="section-kicker">Contact</p>

    <h2 class="section-title">
      Let’s <span>work together</span>
    </h2>

    <p class="section-lead">
      Open to software engineering roles and technical collaborations.
    </p>

    <div id="contact-sent" class="contact-sent" role="status">
      Message sent. I’ll get back to you soon.
    </div>

    <div class="contact-grid">

      <!-- CONTACT FORM -->
      <form class="card contact-form" id="contact-form" method="POST">

        <h3>Send a message</h3>

        <input
          type="hidden"
          name="_subject"
          value="Portfolio - New message"
        >

        <input
          type="hidden"
          name="_captcha"
          value="false"
        >

        <input
          type="hidden"
          name="_template"
          value="table"
        >

        <input
          type="hidden"
          name="_next"
          id="formsubmit-next"
          value=""
        >

        <div class="form-row">
          <label for="name">
            Name <span class="req">*</span>
          </label>

          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-row">
          <label for="email">
            Email <span class="req">*</span>
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-row">
          <label for="subject">
            Subject <span class="req">*</span>
          </label>

          <input
            id="subject"
            name="subject"
            type="text"
            required
          >
        </div>

        <div class="form-row">
          <label for="message">
            Message <span class="req">*</span>
          </label>

          <textarea
            id="message"
            name="message"
            rows="5"
            required
          ></textarea>
        </div>

        <button
          type="submit"
          class="btn btn-primary"
        >
          Send Message
        </button>

      </form>


      <!-- CONTACT INFORMATION -->
      <aside class="card contact-aside">

        <h3>Contact information</h3>

        <a
          class="contact-item"
          data-email
          href="#"
        >
          <span>Email</span>
          <strong data-field="email"></strong>
        </a>

        <a
          class="contact-item"
          data-phone
          href="#"
        >
          <span>Phone</span>
          <strong data-field="phone"></strong>
        </a>

        <div class="contact-item">
          <span>Location</span>
          <strong>Buxar, Bihar, India</strong>
        </div>


        <!-- SOCIAL LINKS -->
        <div class="social-row">

          <!-- GitHub -->
          <a
            class="social-btn"
            data-github
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            title="GitHub"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.1-1.47-1.1-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.95 0-1.1.39-1.99 1.03-2.7-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.8c.85 0 1.71.11 2.51.33 1.9-1.29 2.74-1.02 2.74-1.02.55 1.37.2 2.39.1 2.64.64.71 1.03 1.6 1.03 2.7 0 3.85-2.34 4.7-4.57 4.95.36.31.68.92.68 1.86v2.76c0 .26.18.58.69.48A10 10 0 0 0 12 2Z"
              />
            </svg>
          </a>


          <!-- LinkedIn -->
          <a
            class="social-btn"
            data-linkedin
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
            title="LinkedIn"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M6.5 8.4H3.7V20h2.8V8.4ZM5.1 3C4.1 3 3.3 3.8 3.3 4.8s.8 1.8 1.8 1.8 1.8-.8 1.8-1.8S6.1 3 5.1 3ZM20.3 20h-2.8v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9V20h-2.8V8.4h2.7v1.6c.4-.7 1.3-1.8 3.2-1.8 3.4 0 4 2.2 4 5.1V20Z"
              />
            </svg>
          </a>


          <!-- Instagram -->
          <a
            class="social-btn"
            data-instagram
            href="https://www.instagram.com/riturz_/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
            title="Instagram"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.28-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919C8.333.014 8.741 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"
              />
            </svg>
          </a>


          <!-- Email -->
          <a
            class="social-btn"
            data-email
            aria-label="Email"
            title="Send Email"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5L4 8V6l8 5 8-5Z"
              />
            </svg>
          </a>

        </div>


        <!-- LOCATION MAP -->
        <div class="map-section">

          <button
            class="contact-map"
            id="contact-map"
            type="button"
            aria-label="Explore my location"
          >

            <div class="map-placeholder">
              Loading map...
            </div>

            <div class="map-open-hint">
              Click to explore location
            </div>

          </button>

          <div class="map-label">
            <span class="map-marker-dot-icon"></span>
            Based in Buxar, Bihar, India
          </div>

        </div>

      </aside>

    </div>
  </div>
</section>


<!-- FULL SCREEN MAP MODAL -->

<div
  class="map-modal"
  id="map-modal"
  aria-hidden="true"
>

  <div
    class="map-modal-backdrop"
    data-map-close
  ></div>


  <div class="map-modal-card">

    <button
      class="map-close"
      type="button"
      data-map-close
      aria-label="Close location map"
    >
      ×
    </button>


    <div class="map-modal-header">

      <span>LOCATION</span>

      <strong id="map-location-title">
        Buxar, Bihar, India
      </strong>

      <small id="map-location-subtitle">
        World
      </small>

    </div>


    <div
      class="map-large"
      id="map-large"
    ></div>


    <div class="map-location-footer">

      <span class="map-marker-dot-icon"></span>

      <span id="map-location-text">
        Buxar, Bihar, India
      </span>

    </div>

  </div>

</div>
